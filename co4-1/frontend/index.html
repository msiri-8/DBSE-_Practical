<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Records</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Records</h1>
        <p class="subtitle">Manage student information</p>

        <!-- Add Student Form -->
        <div class="form-box">

            <h2>Add Student</h2>

            <form id="studentForm">

                <input
                    type="text"
                    id="name"
                    placeholder="Student Name"
                    required
                >

                <input
                    type="number"
                    id="age"
                    placeholder="Age"
                    required
                >

                <input
                    type="text"
                    id="course"
                    placeholder="Course"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <button type="submit">Add Student</button>

            </form>

        </div>

        <!-- Student List -->
        <div class="students-box">

            <h2>Student List</h2>

            <button onclick="getStudents()" class="refresh-btn">
                Refresh Students
            </button>

            <div id="studentList">
                <p>Click "Refresh Students" to view students.</p>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
